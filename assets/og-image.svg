<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Saira:wght@600;700;800&family=Manrope:wght@500&family=IBM+Plex+Mono:wght@500&display=swap');
    ]]></style>
    <radialGradient id="glow" cx="78%" cy="36%" r="55%">
      <stop offset="0%" stop-color="#E6C15A" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#E6C15A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="20%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#6AA0E0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6AA0E0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#E1E8F8" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0A0C12"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#blue)"/>

  <!-- logo lockup -->
  <g transform="translate(96,150) scale(2.0)">
    <text x="143" y="45" text-anchor="end" font-family="'Saira',Arial,sans-serif" font-weight="700" font-size="44" letter-spacing="1" fill="#FAFBF7">IDENT</text>
    <g transform="translate(165,29)">
      <circle r="15" fill="none" stroke="#FAFBF7" stroke-width="2.6"/>
      <circle r="7.5" fill="none" stroke="#FAFBF7" stroke-width="1.5" opacity="0.6"/>
      <path d="M0 -22 V-7 M0 7 V22 M-22 0 H-7 M7 0 H22" stroke="#FAFBF7" stroke-width="2.6" stroke-linecap="round"/>
      <circle r="3.4" fill="#E6C15A"/>
    </g>
    <text x="187" y="45" text-anchor="start" font-family="'Saira',Arial,sans-serif" font-weight="700" font-size="44" letter-spacing="1" fill="#FAFBF7">R</text>
  </g>

  <text x="98" y="312" font-family="'IBM Plex Mono',monospace" font-size="22" fill="#E6C15A" letter-spacing="6">SEGURIDAD ELECTRÓNICA · MÉXICO</text>
  <text x="94" y="394" font-family="'Saira',Arial,sans-serif" font-size="74" font-weight="800" fill="#FAFBF7">No vendemos equipos.</text>
  <text x="94" y="468" font-family="'Saira',Arial,sans-serif" font-size="74" font-weight="800" fill="#E6C15A">Diseñamos seguridad.</text>

  <line x1="96" y1="540" x2="1104" y2="540" stroke="#E6C15A" stroke-opacity="0.3" stroke-width="1"/>
  <text x="96" y="582" font-family="'IBM Plex Mono',monospace" font-size="19" fill="#B7BDCA" letter-spacing="2">CCTV · CONTROL DE ACCESO · FIBRA ÓPTICA · COBERTURA NACIONAL</text>
</svg>
